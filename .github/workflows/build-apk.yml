name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:
    inputs:
      version_name:
        description: 'Version name (e.g. 2.8)'
        required: false
        type: string
        default: ''
      version_code:
        description: 'Version code - must be a whole number bigger than last time'
        required: false
        type: string
        default: ''
      release_notes:
        description: 'What changed in this version (shown in the store)'
        required: false
        type: string
        default: ''

jobs:
  build:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    env:
      APP_VERSION_NAME: ${{ inputs.version_name || '2.9.2' }}
      APP_VERSION_CODE: ${{ inputs.version_code || '5' }}
      APP_RELEASE_NOTES: ${{ inputs.release_notes || 'Update' }}
    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK packages
        run: |
          export ANDROID_HOME="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          echo "ANDROID_HOME=$ANDROID_HOME"
          if ! command -v sdkmanager >/dev/null 2>&1; then
            export PATH="$PATH:$ANDROID_HOME/cmdline-tools/latest/bin"
          fi
          yes | sdkmanager --licenses > /dev/null 2>&1 || true
          sdkmanager "platform-tools" "platforms;android-34" "build-tools;34.0.0"

      - name: Scaffold Android project
        run: |
          echo "=== Files in repo ==="
          ls -la
          HTML_FILE=./index.html
          if [ ! -f "$HTML_FILE" ]; then
            echo "ERROR: index.html was not found in the repository root."
            echo "Upload index.html to the repository root first (Add file > Upload files), then re-run this workflow."
            exit 1
          fi
          echo "Using $HTML_FILE as the app page."
          if ! grep -q 'id="metal-radio-app"' "$HTML_FILE"; then
            echo "ERROR: $HTML_FILE is not the metal radio app file (metal-radio-app marker missing)."
            echo "Upload the metal radio index.html to the repository root, then re-run this workflow."
            exit 1
          fi

          mkdir -p app/src/main/java/com/metalradio/app app/src/main/assets/www

          cp "$HTML_FILE" app/src/main/assets/www/index.html

          cat > settings.gradle <<'EOF'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = "MetalRadioApp"
          include(":app")
          EOF

          cat > build.gradle <<'EOF'
          plugins {
              id 'com.android.application' version '8.5.2' apply false
          }
          EOF

          cat > app/build.gradle <<'EOF'
          plugins {
              id 'com.android.application'
          }
          android {
              namespace 'com.metalradio.app'
              compileSdk 34
              defaultConfig {
                  applicationId 'com.metalradio.app'
                  minSdk 24
                  targetSdk 34
                  versionCode __APP_VERSION_CODE__
                  versionName '__APP_VERSION_NAME__'
              }
          }
          EOF
          sed -i "s/__APP_VERSION_CODE__/$APP_VERSION_CODE/g; s/__APP_VERSION_NAME__/$APP_VERSION_NAME/g" app/build.gradle

          cat > app/src/main/AndroidManifest.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.INTERNET" />
              <uses-permission android:name="android.permission.REQUEST_IGNORE_BATTERY_OPTIMIZATIONS" />
              <uses-permission android:name="android.permission.FOREGROUND_SERVICE" />
              <uses-permission android:name="android.permission.FOREGROUND_SERVICE_MEDIA_PLAYBACK" />
              <uses-permission android:name="android.permission.WAKE_LOCK" />
              <uses-permission android:name="android.permission.POST_NOTIFICATIONS" />
              <application
                  android:label="Metal Radio"
                  android:theme="@android:style/Theme.Material.Light.NoActionBar">
                  <activity
                      android:name="com.metalradio.app.MainActivity"
                      android:exported="true"
                      android:windowSoftInputMode="adjustResize"
                      android:configChanges="orientation|screenSize|keyboardHidden">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
                  <service
                      android:name="com.metalradio.app.RadioService"
                      android:exported="false"
                      android:foregroundServiceType="mediaPlayback" />
              </application>
          </manifest>
          EOF

          cat > app/src/main/java/com/metalradio/app/MainActivity.java <<'EOF'
          package com.metalradio.app;

          import android.app.Activity;
          import android.content.Intent;
          import android.net.Uri;
          import android.os.Build;
          import android.os.Bundle;
          import android.provider.Settings;
          import android.speech.tts.TextToSpeech;
          import android.webkit.JavascriptInterface;
          import android.webkit.WebView;
          import android.webkit.WebViewClient;
          import java.util.Locale;

          public class MainActivity extends Activity {
              private WebView webView;
              private TextToSpeech tts;
              private boolean ttsReady = false;
              private String pendingTts = null;

              @Override
              protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);
                  webView = new WebView(this);
                  webView.getSettings().setJavaScriptEnabled(true);
                  webView.getSettings().setDomStorageEnabled(true);
                  webView.getSettings().setAllowFileAccess(true);
                  webView.getSettings().setAllowFileAccessFromFileURLs(true);
                  webView.getSettings().setAllowUniversalAccessFromFileURLs(true);
                  webView.getSettings().setMediaPlaybackRequiresUserGesture(false);
                  webView.setWebViewClient(new WebViewClient());
                  final Activity self = this;
                  webView.addJavascriptInterface(new Object() {
                      @JavascriptInterface
                      public void set(String key, String value) {
                          try {
                              getSharedPreferences("metal_radio_app", MODE_PRIVATE).edit().putString(key, value).commit();
                          } catch (Exception ignored) {}
                      }
                      @JavascriptInterface
                      public String get(String key) {
                          try {
                              return getSharedPreferences("metal_radio_app", MODE_PRIVATE).getString(key, null);
                          } catch (Exception e) {
                              return null;
                          }
                      }
                      @JavascriptInterface
                      public void remove(String key) {
                          try {
                              getSharedPreferences("metal_radio_app", MODE_PRIVATE).edit().remove(key).commit();
                          } catch (Exception ignored) {}
                      }
                  }, "LynxosStore");
                  tts = new TextToSpeech(this, new TextToSpeech.OnInitListener() {
                      @Override
                      public void onInit(int status) {
                          if (status == TextToSpeech.SUCCESS) {
                              try {
                                  int result = tts.setLanguage(Locale.US);
                                  ttsReady = result != TextToSpeech.LANG_MISSING_DATA && result != TextToSpeech.LANG_NOT_SUPPORTED;
                              } catch (Exception e) {
                                  ttsReady = false;
                              }
                              if (ttsReady && pendingTts != null) {
                                  String text = pendingTts;
                                  pendingTts = null;
                                  try {
                                      tts.speak(text, TextToSpeech.QUEUE_FLUSH, null, "metal-radio-reader");
                                  } catch (Exception ignored) {}
                              }
                          }
                      }
                  });
                  webView.addJavascriptInterface(new Object() {
                      @JavascriptInterface
                      public void speak(String text) {
                          if (text == null) return;
                          if (ttsReady && tts != null) {
                              try {
                                  tts.speak(text, TextToSpeech.QUEUE_FLUSH, null, "metal-radio-reader");
                              } catch (Exception ignored) {}
                          } else {
                              pendingTts = text;
                          }
                      }
                      @JavascriptInterface
                      public void stop() {
                          pendingTts = null;
                          try {
                              if (tts != null) tts.stop();
                          } catch (Exception ignored) {}
                      }
                      @JavascriptInterface
                      public void cancel() {
                          stop();
                      }
                  }, "LynxosTts");
                  webView.addJavascriptInterface(new Object() {
                      @JavascriptInterface
                      public void requestExemption() {
                          self.runOnUiThread(new Runnable() {
                              @Override
                              public void run() {
                                  try {
                                      Intent i = new Intent(Settings.ACTION_REQUEST_IGNORE_BATTERY_OPTIMIZATIONS,
                                              Uri.parse("package:" + getPackageName()));
                                      startActivity(i);
                                  } catch (Exception e) {
                                      try {
                                          startActivity(new Intent(Settings.ACTION_IGNORE_BATTERY_OPTIMIZATION_SETTINGS));
                                      } catch (Exception ignored) {}
                                  }
                              }
                          });
                      }
                  }, "LynxosBattery");
                  // Station playback runs in a foreground service (RadioService) with a
                  // persistent notification, which is what Android requires to keep audio
                  // playing when the screen turns off. The JS surface is unchanged:
                  // play/stop/setVolume, and the service reports stream errors back
                  // through window.mrNativeError().
                  RadioService.setErrorListener(new RadioService.ErrorListener() {
                      @Override
                      public void onRadioError() {
                          notifyRadioError();
                      }
                  });
                  webView.addJavascriptInterface(new Object() {
                      @JavascriptInterface
                      public void play(final String url) {
                          try {
                              Intent i = new Intent(MainActivity.this, RadioService.class)
                                  .setAction(RadioService.ACTION_PLAY)
                                  .putExtra(RadioService.EXTRA_URL, url);
                              if (Build.VERSION.SDK_INT >= 26) {
                                  startForegroundService(i);
                              } else {
                                  startService(i);
                              }
                          } catch (Throwable e) {
                              notifyRadioError();
                          }
                      }
                      @JavascriptInterface
                      public void stop() {
                          try {
                              startService(new Intent(MainActivity.this, RadioService.class)
                                  .setAction(RadioService.ACTION_STOP));
                          } catch (Exception ignored) {}
                      }
                      @JavascriptInterface
                      public void setVolume(final float v) {
                          try {
                              startService(new Intent(MainActivity.this, RadioService.class)
                                  .setAction(RadioService.ACTION_SET_VOLUME)
                                  .putExtra(RadioService.EXTRA_VOLUME, v));
                          } catch (Exception ignored) {}
                      }
                  }, "LynxosRadio");
                  if (savedInstanceState != null) {
                      webView.restoreState(savedInstanceState);
                  } else {
                      webView.loadUrl("file:///android_asset/www/index.html");
                  }
                  setContentView(webView);
              }


              private void notifyRadioError() {
                  try {
                      final WebView wv = webView;
                      if (wv != null) {
                          wv.post(new Runnable() {
                              @Override
                              public void run() {
                                  try { wv.evaluateJavascript("if (window.mrNativeError) window.mrNativeError();", null); } catch (Exception ignored) {}
                              }
                          });
                      }
                  } catch (Exception ignored) {}
              }

              @Override
              protected void onDestroy() {
                  if (tts != null) {
                      try {
                          tts.stop();
                          tts.shutdown();
                      } catch (Exception ignored) {}
                      tts = null;
                  }
                  try {
                      startService(new Intent(this, RadioService.class).setAction(RadioService.ACTION_STOP));
                  } catch (Exception ignored) {}
                  RadioService.setErrorListener(null);
                  super.onDestroy();
              }

              @Override
              protected void onSaveInstanceState(Bundle outState) {
                  super.onSaveInstanceState(outState);
                  if (webView != null) {
                      webView.saveState(outState);
                  }
              }

              @Override
              public void onBackPressed() {
                  if (webView != null && webView.canGoBack()) {
                      webView.goBack();
                  } else {
                      super.onBackPressed();
                  }
              }
          }
          EOF

          cat > app/src/main/java/com/metalradio/app/RadioService.java <<'EOF'
          package com.metalradio.app;

          import android.app.Notification;
          import android.app.NotificationChannel;
          import android.app.NotificationManager;
          import android.app.PendingIntent;
          import android.app.Service;
          import android.content.Intent;
          import android.content.pm.ServiceInfo;
          import android.media.AudioAttributes;
          import android.media.MediaPlayer;
          import android.os.Build;
          import android.os.IBinder;
          import android.os.PowerManager;

          // Station playback. A foreground service with a persistent notification is
          // what Android requires to keep audio playing when the screen turns off;
          // a wake lock alone gets suspended by the system.
          public class RadioService extends Service {
              public static final String ACTION_PLAY = "com.metalradio.app.RadioService.PLAY";
              public static final String ACTION_STOP = "com.metalradio.app.RadioService.STOP";
              public static final String ACTION_SET_VOLUME = "com.metalradio.app.RadioService.SET_VOLUME";
              public static final String EXTRA_URL = "url";
              public static final String EXTRA_VOLUME = "volume";

              private static final int NOTIF_ID = 4201;
              private static final String CHANNEL_ID = "metal_radio";

              private MediaPlayer player;
              private static volatile ErrorListener errorListener;

              public interface ErrorListener {
                  void onRadioError();
              }

              public static void setErrorListener(ErrorListener l) {
                  errorListener = l;
              }

              @Override
              public IBinder onBind(Intent intent) {
                  return null;
              }

              @Override
              public void onCreate() {
                  super.onCreate();
                  createChannel();
              }

              @Override
              public int onStartCommand(Intent intent, int flags, int startId) {
                  if (intent == null) {
                      return START_NOT_STICKY;
                  }
                  String action = intent.getAction();
                  if (ACTION_PLAY.equals(action)) {
                      if (goForeground()) {
                          playUrl(intent.getStringExtra(EXTRA_URL));
                      } else {
                          stopPlayback();
                          reportError();
                          stopSelf();
                      }
                  } else if (ACTION_STOP.equals(action)) {
                      stopPlayback();
                      try { stopForeground(true); } catch (Exception ignored) {}
                      stopSelf();
                  } else if (ACTION_SET_VOLUME.equals(action)) {
                      float v = intent.getFloatExtra(EXTRA_VOLUME, 0.8f);
                      try {
                          if (player != null) player.setVolume(v, v);
                      } catch (Exception ignored) {}
                  }
                  return START_NOT_STICKY;
              }

              @Override
              public void onDestroy() {
                  stopPlayback();
                  super.onDestroy();
              }

              private void createChannel() {
                  if (Build.VERSION.SDK_INT >= 26) {
                      try {
                          NotificationChannel ch = new NotificationChannel(
                              CHANNEL_ID, "Metal Radio", NotificationManager.IMPORTANCE_LOW);
                          ch.setDescription("Metal Radio station playback");
                          NotificationManager nm = getSystemService(NotificationManager.class);
                          if (nm != null) nm.createNotificationChannel(ch);
                      } catch (Exception ignored) {}
                  }
              }

              private boolean goForeground() {
                  try {
                      Intent open = new Intent(this, MainActivity.class);
                      open.setFlags(Intent.FLAG_ACTIVITY_SINGLE_TOP | Intent.FLAG_ACTIVITY_CLEAR_TOP);
                      int pflags = PendingIntent.FLAG_UPDATE_CURRENT;
                      if (Build.VERSION.SDK_INT >= 23) {
                          pflags |= PendingIntent.FLAG_IMMUTABLE;
                      }
                      PendingIntent pi = PendingIntent.getActivity(this, 0, open, pflags);
                      Notification.Builder b;
                      if (Build.VERSION.SDK_INT >= 26) {
                          b = new Notification.Builder(this, CHANNEL_ID);
                      } else {
                          b = new Notification.Builder(this);
                      }
                      Notification n = b.setContentTitle("Metal Radio")
                          .setContentText("Playing — open Metal Radio to stop")
                          .setSmallIcon(android.R.drawable.ic_lock_silent_mode_off)
                          .setContentIntent(pi)
                          .setOngoing(true)
                          .build();
                      if (Build.VERSION.SDK_INT >= 29) {
                          startForeground(NOTIF_ID, n, ServiceInfo.FOREGROUND_SERVICE_TYPE_MEDIA_PLAYBACK);
                      } else {
                          startForeground(NOTIF_ID, n);
                      }
                      return true;
                  } catch (Throwable ignored) {}
                  return false;
              }

              private void playUrl(final String url) {
                  stopPlayback();
                  if (url == null || url.isEmpty()) {
                      reportError();
                      return;
                  }
                  try {
                      player = new MediaPlayer();
                      player.setAudioAttributes(new AudioAttributes.Builder()
                          .setUsage(AudioAttributes.USAGE_MEDIA)
                          .setContentType(AudioAttributes.CONTENT_TYPE_MUSIC)
                          .build());
                      player.setWakeMode(getApplicationContext(), PowerManager.PARTIAL_WAKE_LOCK);
                      player.setDataSource(url);
                      player.setOnPreparedListener(new MediaPlayer.OnPreparedListener() {
                          @Override
                          public void onPrepared(MediaPlayer mp) {
                              try { mp.start(); } catch (Exception e) { reportError(); }
                          }
                      });
                      player.setOnErrorListener(new MediaPlayer.OnErrorListener() {
                          @Override
                          public boolean onError(MediaPlayer mp, int what, int extra) {
                              stopPlayback();
                              reportError();
                              return true;
                          }
                      });
                      player.prepareAsync();
                  } catch (Exception e) {
                      stopPlayback();
                      reportError();
                  }
              }

              private void stopPlayback() {
                  try {
                      if (player != null) {
                          try { player.stop(); } catch (Exception ignored) {}
                          try { player.release(); } catch (Exception ignored) {}
                          player = null;
                      }
                  } catch (Exception ignored) {}
              }

              private void reportError() {
                  try {
                      ErrorListener l = errorListener;
                      if (l != null) l.onRadioError();
                  } catch (Exception ignored) {}
              }
          }
          EOF

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7

      - name: Build release APK (unsigned)
        run: gradle :app:assembleRelease

      - name: Sign release APK with the Lynxos key
        run: |
          export ANDROID_HOME="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          APKSIGNER="$ANDROID_HOME/build-tools/34.0.0/apksigner"
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > /tmp/lynxos-release.p12
          "$APKSIGNER" sign --ks /tmp/lynxos-release.p12 --ks-type PKCS12 \
            --ks-pass "pass:${{ secrets.KEYSTORE_PASSWORD }}" \
            --key-pass "pass:${{ secrets.KEY_PASSWORD }}" \
            --ks-key-alias "${{ secrets.KEY_ALIAS }}" \
            --out app/build/outputs/apk/release/app-release.apk \
            app/build/outputs/apk/release/app-release-unsigned.apk
          rm -f /tmp/lynxos-release.p12
          "$APKSIGNER" verify --print-certs app/build/outputs/apk/release/app-release.apk | head -3

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: metal-radio-app-apk
          path: app/build/outputs/apk/release/app-release.apk

      - name: Publish GitHub release
        if: github.event_name == 'workflow_dispatch'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.APP_VERSION_NAME }}+${{ env.APP_VERSION_CODE }}
          name: v${{ env.APP_VERSION_NAME }}+${{ env.APP_VERSION_CODE }}
          body: ${{ env.APP_RELEASE_NOTES }}
          files: app/build/outputs/apk/release/app-release.apk
